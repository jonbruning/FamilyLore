# Supabase free-tier projects are paused after 7 days with no activity, and
# deleted after 90 days paused. This runs a trivial query every day so the
# project always looks active. It reads nothing sensitive: the anon key is
# subject to RLS, so the query comes back empty by design — the point is that
# Postgres gets touched, not what comes back.
name: Supabase keep-alive

on:
  schedule:
    # Daily at 09:17 UTC. Off-the-hour because GitHub delays crons that land on
    # busy times. Daily (not weekly) leaves ~7 missed runs of margin before the
    # 7-day pause window closes.
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/memories?select=id&limit=1")

          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "Keep-alive failed — Supabase did not return 200." >&2
            cat /tmp/body >&2
            exit 1
          fi
          echo "Supabase responded OK; pause timer reset."
